services:
  rascube-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rascube-groundstation
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      # Set ENABLE_SSL=1 to run the server over HTTPS with automatic self-signed SSL certs
      - ENABLE_SSL=0
    volumes:
      - ./examples:/app/examples
      - ./src:/app/src
    # Uncomment the lines below if running on Linux with a physical USB Dongle attached directly to host
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

